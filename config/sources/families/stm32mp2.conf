declare -g ARCH="arm64"
declare -g OFFSET=16
declare -g INSTALL_HEADERS="yes"

declare -g ATFSOURCE='https://github.com/MYiR-Dev/myir-st-arm-trusted-firmware.git'
declare -g ATFBRANCH="branch:develop-ld25x-v2.10"
declare -g ATFPATCHDIR='atf-stm32mp2'
declare -g ATF_TARGET_MAP="PLAT=stm32mp2 ARCH=aarch64 ARM_ARCH_MAJOR=8 SPD=opteed STM32MP25=1 STM32MP_SDMMC=1 STM32MP_EMMC=1 STM32MP_LPDDR4_TYPE=1 DTB_FILE_NAME=${BOARD}.dtb all;;build/stm32mp2/release/bl2.bin build/stm32mp2/release/bl31.bin"

declare -g BOOTDELAY=1
declare -g BOOTSOURCE='https://github.com/MYiR-Dev/myir-st-u-boot.git'
declare -g BOOTPATCHDIR="${BOOTPATCHDIR:-"u-boot-stm32mp2"}"
declare -g BOOTBRANCH="${BOOTBRANCH:-"branch:develop-ld25x-v2023.10"}"
declare -g UBOOT_TARGET_MAP=";;u-boot.bin fip.bin tf-a.stm32"

declare -g IMAGE_PARTITION_TABLE="gpt"
declare -g LINUXFAMILY="stm32mp2"

# OP-TEE build require pkgs
function add_host_dependencies__stm32mp2_add_pkgs_hostdep() {
	display_alert "Adding bootloader build dep" "for ${BOARD} bootloader compile" "debug"
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} cmake python3-cryptography python3-pil python3-pyelftools"
}

# STM32MP2 target runtime packages
function post_family_config__stm32mp2_add_target_packages() {
	display_alert "Adding STM32MP2 target packages" "gdisk mmc-utils" "debug"

	add_packages_to_image gdisk mmc-utils
}

# Handling of FIP blobs
function uboot_custom_postprocess() {
	
	display_alert "fetch optee."
	fetch_from_repo "${OPTEE_GIT_URL:-"https://github.com/MYiR-Dev/myir-st-optee_os.git"}" "optee_os" "branch:${OPTEE_GIT_BRANCH:-"develop-ld25x-4.0"}"
	
	declare -g OPTEE_DIR="${SRC}/cache/sources/optee_os"
	declare -g UBOOT_BUILD_DIR="${SRC}/cache/sources/u-boot-worktree/u-boot/develop-ld25x-v2023.10"
	declare -g ATF_BUILD_DIR="${SRC}/cache/sources/arm-trusted-firmware/develop-ld25x-v2.10"
	
	display_alert "compile optee."
	cd ${OPTEE_DIR}

	make -j$(nproc) PLATFORM=stm32mp2 \
		CROSS_COMPILE=${UBOOT_COMPILER} \
		ARCH=arm \
		CFG_TEE_CORE_LOG_LEVEL=2 \
		CFG_EMBED_DTB_SOURCE_FILE=${BOARD}.dts
	
	cd ${ATF_BUILD_DIR}
	# ATF needs OP-TEE blobs, recompile ATF.
	make -j$(nproc) PLAT=stm32mp2 \
		ARCH=aarch64 \
		ARM_ARCH_MAJOR=8 \
		CROSS_COMPILE=${ATF_COMPILER} \
		LOG_LEVEL=40 \
		SPD=opteed \
		STM32MP25=1 \
		BL32=${OPTEE_DIR}/out/arm-plat-stm32mp2/core/tee-header_v2.bin \
		BL32_EXTRA1=${OPTEE_DIR}/out/arm-plat-stm32mp2/core/tee-pager_v2.bin \
		BL33=${UBOOT_BUILD_DIR}/u-boot-nodtb.bin \
		BL33_CFG=${UBOOT_BUILD_DIR}/u-boot.dtb \
		DTB_FILE_NAME=${BOARD}.dtb \
		STM32MP_SDMMC=1 STM32MP_EMMC=1 STM32MP_LPDDR4_TYPE=1 all fip
		
	cp "${ATF_BUILD_DIR}/build/stm32mp2/release/fip.bin" \
		"${UBOOT_BUILD_DIR}"
	cp "${ATF_BUILD_DIR}/build/stm32mp2/release/tf-a-${BOARD}.stm32" \
		"${UBOOT_BUILD_DIR}/tf-a.stm32"
	
	cd "${UBOOT_BUILD_DIR}"
}

case "${BRANCH}" in
		
	vendor)
		KERNELSOURCE='https://github.com/chainsx/linux-stm32mp2.git'
		KERNELBRANCH="branch:linux-6.6"
		declare -g KERNEL_MAJOR_MINOR="6.6"
		KERNELPATCHDIR="${LINUXFAMILY}-${BRANCH}"
		LINUXCONFIG="linux-${LINUXFAMILY}-${BRANCH}"

		;;

esac

write_uboot_platform() {
    local src_dir="$1"
    local dev

    # Resolve possible symlink and always operate on the real block device.
    dev="$(readlink -f "$2")"

    local devname="${dev##*/}"
    local tf_a="${src_dir}/tf-a.stm32"
    local fip="${src_dir}/fip.bin"
    local boot0="${dev}boot0"
    local boot1="${dev}boot1"

    local dump
    local part_name
    local expected_start
    local expected_size
    local line
    local actual_start
    local actual_size

    # Basic sanity checks
    if [[ ! -b "$dev" ]]; then
        echo "ERROR: invalid target block device: $dev" >&2
        return 1
    fi

    if [[ ! -f "$tf_a" ]]; then
        echo "ERROR: TF-A image not found: $tf_a" >&2
        return 1
    fi

    if [[ ! -f "$fip" ]]; then
        echo "ERROR: FIP image not found: $fip" >&2
        return 1
    fi

    # STM32MP2 user-area layout
    #
    #   0x00100000 - 0x001fffff : fsbla
    #   0x00200000 - 0x005fffff : fip
    #
    #   0x00980000 - 0x009fffff : U-Boot ENV primary
    #   0x00a00000 - 0x00a7ffff : U-Boot ENV redundant
    #
    #   0x01000000 - ...        : Armbian filesystem
    #
    # Corresponding U-Boot settings:
    #
    #   CONFIG_ENV_OFFSET=0x980000
    #   CONFIG_ENV_SECT_SIZE=0x80000
    #   CONFIG_ENV_OFFSET_REDUND=0xA00000

    dump="$(sfdisk --dump "$dev" 2>/dev/null)" || {
        echo "ERROR: unable to read partition table from $dev" >&2
        return 1
    }

    if ! printf '%s\n' "$dump" | grep -q '^label: gpt$'; then
        echo "ERROR: $dev is not using GPT" >&2
        return 1
    fi

    # Ensure bootloader partitions exist.
    #
    # Idempotent behavior:
    #
    #   missing partition
    #       -> create
    #
    #   existing partition with correct geometry
    #       -> keep
    #
    #   existing partition with wrong geometry
    #       -> abort

    while read -r part_name expected_start expected_size; do

        dump="$(sfdisk --dump "$dev" 2>/dev/null)" || {
            echo "ERROR: unable to read partition table from $dev" >&2
            return 1
        }

        line="$(
            printf '%s\n' "$dump" |
                awk -v n="$part_name" \
                    'index($0, "name=\"" n "\"") { print; exit }'
        )"

        if [[ -n "$line" ]]; then

            actual_start="$(
                printf '%s\n' "$line" |
                    sed -n \
                        's/.*start=[[:space:]]*\([0-9][0-9]*\).*/\1/p'
            )"

            actual_size="$(
                printf '%s\n' "$line" |
                    sed -n \
                        's/.*size=[[:space:]]*\([0-9][0-9]*\).*/\1/p'
            )"

            if [[ "$actual_start" != "$expected_start" ||
                  "$actual_size" != "$expected_size" ]]; then

                echo "ERROR: partition '$part_name' on $dev has unexpected geometry" >&2
                echo "       actual:   start=$actual_start size=$actual_size" >&2
                echo "       expected: start=$expected_start size=$expected_size" >&2

                return 1
            fi

            echo "Partition '$part_name' already correct; keeping it"
            continue
        fi

        printf 'start=%s,size=%s,name="%s"\n' \
            "$expected_start" \
            "$expected_size" \
            "$part_name" |
            sfdisk --no-reread --append "$dev" || {

                echo "ERROR: failed to create partition '$part_name' on $dev" >&2
                return 1
            }

    done <<'PARTITIONS'
fsbla 2048 2048
fip 4096 8192
u-boot-env 19456 2048
PARTITIONS

    # Write user-area bootloader.
    #
    # TF-A:
    #   1 MiB / sector 2048
    #
    # FIP:
    #   2 MiB / sector 4096

    echo "Writing TF-A user-area copy to $dev"

    dd \
        if="$tf_a" \
        of="$dev" \
        bs=512 \
        seek=2048 \
        conv=notrunc,fsync || {

            echo "ERROR: failed to write TF-A to $dev user area" >&2
            return 1
        }

    echo "Writing FIP to $dev"

    dd \
        if="$fip" \
        of="$dev" \
        bs=512 \
        seek=4096 \
        conv=notrunc,fsync || {

            echo "ERROR: failed to write FIP to $dev user area" >&2
            return 1
        }

    # eMMC-specific handling
    if [[ -b "$boot0" && -b "$boot1" ]]; then

        local boot0_force_ro="/sys/block/${devname}boot0/force_ro"
        local boot1_force_ro="/sys/block/${devname}boot1/force_ro"

        local boot0_ro
        local boot1_ro

        echo "eMMC detected: $dev"

        # Check force_ro controls.
        if [[ ! -r "$boot0_force_ro" ||
              ! -w "$boot0_force_ro" ||
              ! -r "$boot1_force_ro" ||
              ! -w "$boot1_force_ro" ]]; then

            echo "ERROR: cannot access eMMC boot partition force_ro controls" >&2
            return 1
        fi

        # Save original read-only state.
        boot0_ro="$(cat "$boot0_force_ro")" || {
            echo "ERROR: cannot read $boot0_force_ro" >&2
            return 1
        }

        boot1_ro="$(cat "$boot1_force_ro")" || {
            echo "ERROR: cannot read $boot1_force_ro" >&2
            return 1
        }

        # Make boot0 writable.
        echo 0 > "$boot0_force_ro" || {
            echo "ERROR: cannot make $boot0 writable" >&2
            return 1
        }

        # Make boot1 writable.
        if ! echo 0 > "$boot1_force_ro"; then

            echo "$boot0_ro" > "$boot0_force_ro" 2>/dev/null || true

            echo "ERROR: cannot make $boot1 writable" >&2
            return 1
        fi

        # Write TF-A to boot0.
        echo "Writing TF-A to $boot0"

        if ! dd \
            if="$tf_a" \
            of="$boot0" \
            bs=512 \
            conv=notrunc,fsync; then

            echo "$boot0_ro" > "$boot0_force_ro" 2>/dev/null || true
            echo "$boot1_ro" > "$boot1_force_ro" 2>/dev/null || true

            echo "ERROR: failed to write TF-A to $boot0" >&2
            return 1
        fi

        # Write TF-A to boot1.
        echo "Writing TF-A to $boot1"

        if ! dd \
            if="$tf_a" \
            of="$boot1" \
            bs=512 \
            conv=notrunc,fsync; then

            echo "$boot0_ro" > "$boot0_force_ro" 2>/dev/null || true
            echo "$boot1_ro" > "$boot1_force_ro" 2>/dev/null || true

            echo "ERROR: failed to write TF-A to $boot1" >&2
            return 1
        fi

        # Restore original read-only state.
        echo "$boot0_ro" > "$boot0_force_ro" || {
            echo "ERROR: failed to restore $boot0 force_ro state" >&2
            return 1
        }

        echo "$boot1_ro" > "$boot1_force_ro" || {
            echo "ERROR: failed to restore $boot1 force_ro state" >&2
            return 1
        }

        # Configure eMMC EXT_CSD.
        if ! command -v mmc >/dev/null 2>&1; then
            echo "ERROR: mmc-utils is required to configure eMMC EXT_CSD" >&2
            echo "       'mmc' command was not found" >&2
            return 1
        fi

        # EXT_CSD[177] BOOT_BUS_WIDTH
        #
        # STM32MP2 BootROM:
        #
        #   boot mode       = single_backward
        #   reset bus width = x1
        #   boot bus width  = x1

        echo "Configuring eMMC boot bus"

        mmc bootbus set \
            single_backward \
            x1 \
            x1 \
            "$dev" || {

                echo "ERROR: failed to configure eMMC BOOT_BUS_WIDTH" >&2
                return 1
            }

        # EXT_CSD[179] PARTITION_CONFIG
        #
        # boot_partition = 1
        #   -> Boot Partition 1
        #   -> Linux /dev/mmcblkXboot0
        #
        # send_ack = 1
        #   -> enable Boot ACK

        echo "Selecting eMMC boot0 and enabling Boot ACK"

        mmc bootpart enable \
            1 \
            1 \
            "$dev" || {

                echo "ERROR: failed to select eMMC boot0 / enable Boot ACK" >&2
                return 1
            }

        echo "eMMC EXT_CSD boot configuration completed"
    fi

    return 0
}
