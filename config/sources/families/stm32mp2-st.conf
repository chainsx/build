#
# STM32MP2-ST family: MYiR MYB-STM32MP257X boards supported on top of the
# official STMicroelectronics stm32mp-r3.1 releases plus board patches:
#   - TF-A:    https://github.com/STMicroelectronics/arm-trusted-firmware (v2.10-stm32mp-r3.1)
#   - U-Boot:  https://github.com/STMicroelectronics/u-boot               (v2023.10-stm32mp-r3.1)
#   - OP-TEE:  https://github.com/STMicroelectronics/optee_os             (4.0.0-stm32mp-r3.1)
#   - Kernel:  https://github.com/STMicroelectronics/linux                (v6.6-stm32mp-r3.1)
#

declare -g ARCH="arm64"
declare -g OFFSET=16
declare -g INSTALL_HEADERS="yes"

declare -g ATFSOURCE='https://github.com/STMicroelectronics/arm-trusted-firmware.git'
declare -g ATFBRANCH="tag:v2.10-stm32mp-r3.1"
declare -g ATFPATCHDIR='atf-stm32mp2-st'
declare -g ATF_SKIP_LDFLAGS_WL="yes" # TF-A links via ld.bfd when LTO is off

declare -g ATF_TARGET_MAP="PLAT=stm32mp2 ARCH=aarch64 ARM_ARCH_MAJOR=8 SPD=opteed STM32MP_SDMMC=1 STM32MP_EMMC=1 STM32MP_LPDDR4_TYPE=1 ENABLE_LTO=0 DTB_FILE_NAME=${BOARD}.dtb all;;build/stm32mp2/release/bl2.bin build/stm32mp2/release/bl31.bin"

declare -g BOOTDELAY=1
declare -g BOOTSOURCE='https://github.com/STMicroelectronics/u-boot.git'
declare -g BOOTPATCHDIR="${BOOTPATCHDIR:-"u-boot-stm32mp2-st"}"
declare -g BOOTBRANCH="${BOOTBRANCH:-"tag:v2023.10-stm32mp-r3.1"}"
declare -g UBOOT_TARGET_MAP=";;u-boot.bin fip.bin tf-a.stm32"

declare -g IMAGE_PARTITION_TABLE="gpt"
declare -g LINUXFAMILY="stm32mp2-st"

# OP-TEE build requires extra host packages
function add_host_dependencies__stm32mp2_st_add_pkgs_hostdep() {
	display_alert "Adding bootloader build deps" "for ${BOARD} bootloader compile" "debug"
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} cmake python3-cryptography python3-pil python3-pyelftools python3-pycryptodome"
}

# STM32MP2 target runtime packages
function post_family_config__stm32mp2_st_add_target_packages() {
	display_alert "Adding STM32MP2 target packages" "gdisk mmc-utils" "debug"

	add_packages_to_image gdisk mmc-utils
}

# Board -> device tree / OP-TEE platform names
case "${BOARD}" in
	myb-stm32mp257x-1GB)
		declare -g STM32MP2_DTB="myb-stm32mp257x-1GB"
		declare -g STM32MP2_OPTEE_PLATFORM="stm32mp2-257X_MYB1GB"
		;;
	*)
		exit_with_error "Unknown board ${BOARD} for family stm32mp2-st"
		;;
esac

# Build OP-TEE (BL32) from the ST tree + board patches, then re-link the TF-A
# FIP image containing BL32 (OP-TEE) and BL33 (U-Boot). Produces the two
# bootloader artifacts consumed by write_uboot_platform():
#   tf-a.stm32 - TF-A BL2 with STM32 header (fsbl partition)
#   fip.bin    - FIP image (fip partition)
function uboot_custom_postprocess() {
	# fetch_from_repo() changes the current directory: capture paths first.
	declare -g MYB_UBOOT_DIR="${PWD}"
	declare -g MYB_ATF_DIR="${SRC}/cache/sources/${ATFSOURCEDIR}"

	display_alert "Fetching ST OP-TEE" "for ${BOARD} FIP generation" "info"
	fetch_from_repo "${OPTEE_GIT_URL:-"https://github.com/STMicroelectronics/optee_os.git"}" \
		"optee-stm32mp2" "tag:4.0.0-stm32mp-r3.1"

	declare -g OPTEE_DIR="${SRC}/cache/sources/optee-stm32mp2"

	# Apply the board patches to OP-TEE once; idempotency is guarded by
	# checking for a file added by the first patch.
	display_alert "Patching OP-TEE" "optee-stm32mp2-st" "info"
	if [[ ! -f "${OPTEE_DIR}/core/arch/arm/dts/myb-stm32mp257x-base.dtsi" ]]; then
		(
			cd "${OPTEE_DIR}" || exit 1
			git -c user.name="Armbian Build" -c user.email="build@armbian.org" \
				am --keep-cr "${SRC}"/patch/optee/optee-stm32mp2-st/*.patch ||
				exit_with_error "Failed to apply OP-TEE patches"
		)
	fi

	display_alert "Compiling OP-TEE" "${STM32MP2_OPTEE_PLATFORM}" "info"
	(
		cd "${OPTEE_DIR}" || exit 1
		run_host_command_logged make -j"$(nproc)" \
			"PLATFORM=${STM32MP2_OPTEE_PLATFORM}" \
			"CROSS_COMPILE=${UBOOT_COMPILER}" \
			"CROSS_COMPILE64=${UBOOT_COMPILER}" \
			"CFG_WITH_ARM_TRUSTED_FW=y" \
			all
	)

	declare -g OPTEE_OUT="${OPTEE_DIR}/out/arm-plat-stm32mp2/core"

	# TF-A needs the OP-TEE blobs and U-Boot binaries: rebuild the FIP.
	# ENABLE_LTO=0: Ubuntu's gcc driver injects .note.gnu.build-id at address
	# zero when used as the LTO linker wrapper, which makes the plain objcopy
	# STM32 image span the whole 0x0..0x0e002600 gap (235MB sparse file).
	display_alert "Re-linking TF-A FIP with OP-TEE + U-Boot" "${BOARD}" "info"
	(
		cd "${MYB_ATF_DIR}" || exit 1
		run_host_command_logged make -j"$(nproc)" \
			"PLAT=stm32mp2" \
			"ARCH=aarch64" \
			"ARM_ARCH_MAJOR=8" \
			"CROSS_COMPILE=${ATF_COMPILER}" \
			"LOG_LEVEL=40" \
			"SPD=opteed" \
			"ENABLE_LTO=0" \
			"STM32MP_SDMMC=1" \
			"STM32MP_EMMC=1" \
			"STM32MP_LPDDR4_TYPE=1" \
			"DTB_FILE_NAME=${STM32MP2_DTB}.dtb" \
			"BL32=${OPTEE_OUT}/tee-header_v2.bin" \
			"BL32_EXTRA1=${OPTEE_OUT}/tee-pager_v2.bin" \
			"BL32_EXTRA2=${OPTEE_OUT}/tee-pageable_v2.bin" \
			"BL33=${MYB_UBOOT_DIR}/u-boot-nodtb.bin" \
			"BL33_CFG=${MYB_UBOOT_DIR}/u-boot.dtb" \
			all fip

		cp "build/stm32mp2/release/fip.bin" "${MYB_UBOOT_DIR}/fip.bin"
		cp "build/stm32mp2/release/tf-a-${STM32MP2_DTB}.stm32" "${MYB_UBOOT_DIR}/tf-a.stm32"
	)

	# Restore the u-boot working directory for Armbian's packaging step.
	cd "${MYB_UBOOT_DIR}" || exit_with_error "Could not cd back to ${MYB_UBOOT_DIR}"
}

case "${BRANCH}" in

	vendor)
		KERNELSOURCE='https://github.com/STMicroelectronics/linux.git'
		KERNELBRANCH="tag:v6.6-stm32mp-r3.1"
		declare -g KERNEL_MAJOR_MINOR="6.6"
		KERNELPATCHDIR="${LINUXFAMILY}-${BRANCH}"
		LINUXCONFIG="linux-${LINUXFAMILY}-${BRANCH}"
		;;

esac

write_uboot_platform() {
    local src_dir="$1"
    local dev

    # Resolve possible symlink and always operate on the real block device.
    dev="$(readlink -f "$2")"

    local devname="${dev##*/}"
    local tf_a="${src_dir}/tf-a.stm32"
    local fip="${src_dir}/fip.bin"
    local boot0="${dev}boot0"
    local boot1="${dev}boot1"

    local dump
    local part_name
    local expected_start
    local expected_size
    local line
    local actual_start
    local actual_size

    # Basic sanity checks
    if [[ ! -b "$dev" ]]; then
        echo "ERROR: invalid target block device: $dev" >&2
        return 1
    fi

    if [[ ! -f "$tf_a" ]]; then
        echo "ERROR: TF-A image not found: $tf_a" >&2
        return 1
    fi

    if [[ ! -f "$fip" ]]; then
        echo "ERROR: FIP image not found: $fip" >&2
        return 1
    fi

    # STM32MP2 user-area layout
    #
    #   0x00100000 - 0x001fffff : fsbla
    #   0x00200000 - 0x005fffff : fip
    #
    #   0x00980000 - 0x009fffff : U-Boot ENV primary
    #   0x00a00000 - 0x00a7ffff : U-Boot ENV redundant
    #
    #   0x01000000 - ...        : Armbian filesystem
    #
    # Corresponding U-Boot settings:
    #
    #   CONFIG_ENV_OFFSET=0x980000
    #   CONFIG_ENV_SECT_SIZE=0x80000
    #   CONFIG_ENV_OFFSET_REDUND=0xA00000

    dump="$(sfdisk --dump "$dev")" || {
        echo "ERROR: failed to dump partition table of $dev" >&2
        return 1
    }

    # fsbla / fip / u-boot-env partitions in user area
    while read -r part_name expected_start expected_size; do

        # Skip comments and empty lines
        [[ -z "${part_name}" || "${part_name}" == \#* ]] && continue

        if echo "$dump" | grep -q "name=\"${part_name}\""; then

            line="$(echo "$dump" | grep "name=\"${part_name}\"")"
            actual_start="$(echo "$line" | awk '{print $2}' | tr -d 'a-z,:')"
            actual_size="$(echo "$line" | awk '{print $4}' | tr -d 'a-z,:')"

            if [[ "${actual_start}" == "${expected_start}" && "${actual_size}" == "${expected_size}" ]]; then
                echo "Partition '${part_name}' already correct; keeping it"
                continue
            fi
        fi

        printf 'start=%s,size=%s,name="%s"\n' \
            "$expected_start" \
            "$expected_size" \
            "$part_name" |
            sfdisk --no-reread --append "$dev" || {

                echo "ERROR: failed to create partition '${part_name}' on $dev" >&2
                return 1
            }

    done <<'PARTITIONS'
fsbla 2048 2048
fip 4096 8192
u-boot-env 19456 2048
PARTITIONS

    # Write user-area bootloader.
    #
    # TF-A:
    #   1 MiB / sector 2048
    #
    # FIP:
    #   2 MiB / sector 4096

    echo "Writing TF-A user-area copy to $dev"

    dd \
        if="$tf_a" \
        of="$dev" \
        bs=512 \
        seek=2048 \
        conv=notrunc,fsync || {

            echo "ERROR: failed to write TF-A to $dev user area" >&2
            return 1
        }

    echo "Writing FIP to $dev"

    dd \
        if="$fip" \
        of="$dev" \
        bs=512 \
        seek=4096 \
        conv=notrunc,fsync || {

            echo "ERROR: failed to write FIP to $dev user area" >&2
            return 1
        }

    # eMMC-specific handling
    if [[ -b "$boot0" && -b "$boot1" ]]; then

        local boot0_force_ro="/sys/block/${devname}boot0/force_ro"
        local boot1_force_ro="/sys/block/${devname}boot1/force_ro"

        local boot0_ro
        local boot1_ro

        echo "eMMC detected: $dev"

        # Check force_ro controls.
        if [[ ! -r "$boot0_force_ro" ||
              ! -w "$boot0_force_ro" ||
              ! -r "$boot1_force_ro" ||
              ! -w "$boot1_force_ro" ]]; then

            echo "ERROR: cannot access eMMC boot partition force_ro controls" >&2
            return 1
        fi

        # Save original read-only state.
        boot0_ro="$(cat "$boot0_force_ro")" || {
            echo "ERROR: cannot read $boot0_force_ro" >&2
            return 1
        }

        boot1_ro="$(cat "$boot1_force_ro")" || {
            echo "ERROR: cannot read $boot1_force_ro" >&2
            return 1
        }

        # Make boot0 writable.
        echo 0 > "$boot0_force_ro" || {
            echo "ERROR: cannot make boot0 writable" >&2
            return 1
        }

        # Make boot1 writable.
        if ! echo 0 > "$boot1_force_ro"; then

            echo "$boot0_ro" > "$boot0_force_ro" 2>/dev/null || true

            echo "ERROR: cannot make boot1 writable" >&2
            return 1
        fi

        # Write TF-A to boot0.
        echo "Writing TF-A to $boot0"

        if ! dd \
            if="$tf_a" \
            of="$boot0" \
            bs=512 \
            conv=notrunc,fsync; then

            echo "$boot0_ro" > "$boot0_force_ro" 2>/dev/null || true
            echo "$boot1_ro" > "$boot1_force_ro" 2>/dev/null || true

            echo "ERROR: failed to write TF-A to $boot0" >&2
            return 1
        fi

        # Write TF-A to boot1.
        echo "Writing TF-A to $boot1"

        if ! dd \
            if="$tf_a" \
            of="$boot1" \
            bs=512 \
            conv=notrunc,fsync; then

            echo "$boot0_ro" > "$boot0_force_ro" 2>/dev/null || true
            echo "$boot1_ro" > "$boot1_force_ro" 2>/dev/null || true

            echo "ERROR: failed to write TF-A to $boot1" >&2
            return 1
        fi

        # Restore original read-only state.
        echo "$boot0_ro" > "$boot0_force_ro" || {
            echo "ERROR: cannot restore boot0 force_ro state" >&2
            return 1
        }

        echo "$boot1_ro" > "$boot1_force_ro" 2>/dev/null || true

        # Configure eMMC EXT_CSD.
        if ! command -v mmc >/dev/null 2>&1; then
            echo "ERROR: mmc-utils is required to configure eMMC EXT_CSD" >&2
            echo "       'mmc' command was not found" >&2
            return 1
        fi

        # EXT_CSD[177] BOOT_BUS_WIDTH
        #
        # STM32MP2 BootROM:
        #
        #   boot mode       = single_backward
        #   reset bus width = x1
        #   boot bus width  = x1

        echo "Configuring eMMC boot bus"

        mmc bootbus set \
            single_backward \
            x1 \
            x1 \
            "$dev" || {

                echo "ERROR: failed to configure eMMC BOOT_BUS_WIDTH" >&2
                return 1
            }

        # EXT_CSD[179] PARTITION_CONFIG
        #
        # boot_partition = 1
        #   -> Boot Partition 1
        #   -> Linux /dev/mmcblkXboot0
        #
        # send_ack = 1
        #   -> enable Boot ACK

        echo "Selecting eMMC boot0 and enabling Boot ACK"

        mmc bootpart enable \
            1 \
            1 \
            "$dev" || {

                echo "ERROR: failed to select eMMC boot0 / enable Boot ACK" >&2
                return 1
            }

        echo "eMMC EXT_CSD boot configuration completed"
    fi

    return 0
}
