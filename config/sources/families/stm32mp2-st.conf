#
# STM32MP2-ST family: MYiR MYB-STM32MP257X boards supported on top of the
# official STMicroelectronics stm32mp-r3.1 releases plus board patches:
#   - TF-A:    https://github.com/STMicroelectronics/arm-trusted-firmware (v2.10-stm32mp-r3.1)
#   - U-Boot:  https://github.com/STMicroelectronics/u-boot               (v2023.10-stm32mp-r3.1)
#   - OP-TEE:  https://github.com/STMicroelectronics/optee_os             (4.0.0-stm32mp-r3.1)
#   - Kernel:  https://github.com/STMicroelectronics/linux                (v6.6-stm32mp-r3.1)
#

declare -g ARCH="arm64"
declare -g OFFSET=16
declare -g INSTALL_HEADERS="yes"

declare -g ATFSOURCE='https://github.com/STMicroelectronics/arm-trusted-firmware.git'
declare -g ATFBRANCH="tag:v2.10-stm32mp-r3.1"
declare -g ATFPATCHDIR='atf-stm32mp2-st'
declare -g ATF_SKIP_LDFLAGS_WL="yes" # TF-A links via ld.bfd when LTO is off

case "${BOARD}" in
	myb-stm32mp257x-1GB)
		declare -g STM32MP2_DTB="myb-stm32mp257x-1GB"
		declare -g STM32MP2_OPTEE_PLATFORM="stm32mp2-257X_MYB1GB"
		;;
	*)
		exit_with_error "Unknown board ${BOARD} for family stm32mp2-st"
		;;
esac

declare -g ATF_TARGET_MAP="PLAT=stm32mp2 ARCH=aarch64 ARM_ARCH_MAJOR=8 SPD=opteed STM32MP_SDMMC=1 STM32MP_EMMC=1 STM32MP_LPDDR4_TYPE=1 ENABLE_LTO=0 DTB_FILE_NAME=${STM32MP2_DTB}.dtb all;;build/stm32mp2/release/bl2.bin build/stm32mp2/release/bl31.bin"

declare -g OPTEESOURCE="${OPTEE_GIT_URL:-https://github.com/STMicroelectronics/optee_os.git}"
declare -g OPTEEBRANCH='tag:4.0.0-stm32mp-r3.1'
declare -g OPTEEPATCHDIR='optee-stm32mp2-st'

# OP-TEE is built inside the U-Boot artifact. Include its source and patch
# contents in the existing board-specific cache key.
declare -g UBOOT_HASH_EXTRA="$(
	{
		printf '%s\n' "${OPTEESOURCE}" "${OPTEEBRANCH}"
		for optee_patch in "${SRC}"/patch/optee/"${OPTEEPATCHDIR}"/*.patch \
			"${USERPATCHES_PATH}"/optee/"${OPTEEPATCHDIR}"/*.patch; do
			[[ -f "${optee_patch}" ]] && sha256sum "${optee_patch}" | cut -d' ' -f1
		done
	} | sha256sum | cut -d' ' -f1
)"

declare -g BOOTDELAY=1
declare -g BOOTSOURCE='https://github.com/STMicroelectronics/u-boot.git'
declare -g BOOTPATCHDIR="${BOOTPATCHDIR:-"u-boot-stm32mp2-st"}"
declare -g BOOTBRANCH="${BOOTBRANCH:-"tag:v2023.10-stm32mp-r3.1"}"
declare -g UBOOT_TARGET_MAP=";;u-boot.bin fip.bin tf-a.stm32"

declare -g IMAGE_PARTITION_TABLE="gpt"
declare -g LINUXFAMILY="stm32mp2-st"

# OP-TEE build requires extra host packages
function add_host_dependencies__stm32mp2_st_add_pkgs_hostdep() {
	display_alert "Adding bootloader build deps" "for ${BOARD} bootloader compile" "debug"
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} cmake python3-cryptography python3-pil python3-pyelftools python3-pycryptodome"
}

# STM32MP2 target runtime packages
function post_family_config__stm32mp2_st_add_target_packages() {
	display_alert "Adding STM32MP2 target packages" "gdisk mmc-utils" "debug"

	add_packages_to_image gdisk mmc-utils
	# The board requests nosplash; drop the conflicting generic splash flag.
	MAIN_CMDLINE="${MAIN_CMDLINE/ splash / }"
}

# Build OP-TEE (BL32) from the ST tree + board patches, then re-link the TF-A
# FIP image containing BL32 (OP-TEE) and BL33 (U-Boot). Produces the two
# bootloader artifacts consumed by write_uboot_platform():
#   tf-a.stm32 - TF-A BL2 with STM32 header (fsbl partition)
#   fip.bin    - FIP image (fip partition)
function uboot_custom_postprocess() {
	# fetch_from_repo() changes the current directory: capture paths first.
	declare -g MYB_UBOOT_DIR="${PWD}"
	declare -g MYB_ATF_DIR="${SRC}/cache/sources/${ATFSOURCEDIR}"

	display_alert "Fetching ST OP-TEE" "for ${BOARD} FIP generation" "info"
	fetch_from_repo "${OPTEESOURCE}" "optee-stm32mp2" "${OPTEEBRANCH}"

	declare -g OPTEE_DIR="${SRC}/cache/sources/optee-stm32mp2"

	# Apply each patch independently. A board-file sentinel misses later fixes
	# when an existing source cache already contains the first patch.
	display_alert "Patching OP-TEE" "optee-stm32mp2-st" "info"
	(
		cd "${OPTEE_DIR}" || exit 1
		for optee_patch in "${SRC}"/patch/optee/"${OPTEEPATCHDIR}"/*.patch \
			"${USERPATCHES_PATH}"/optee/"${OPTEEPATCHDIR}"/*.patch; do
			[[ -f "${optee_patch}" ]] || continue
			local patch_subject
			patch_subject="$(sed -n 's/^Subject: \[PATCH\] //p' "${optee_patch}" | head -n 1)"
			[[ -n "${patch_subject}" ]] || exit_with_error "Missing OP-TEE patch subject in ${optee_patch}"
			if git log --format=%s | grep -Fxq "${patch_subject}"; then
				continue
			fi
			git -c user.name="Armbian Build" -c user.email="build@armbian.org" \
				am --keep-cr "${optee_patch}" ||
					exit_with_error "Failed to apply OP-TEE patch ${optee_patch}"
		done
	)

	display_alert "Compiling OP-TEE" "${STM32MP2_OPTEE_PLATFORM}" "info"
	(
		cd "${OPTEE_DIR}" || exit 1
		run_host_command_logged make -j"$(nproc)" \
			"PLATFORM=${STM32MP2_OPTEE_PLATFORM}" \
			"CROSS_COMPILE=${UBOOT_COMPILER}" \
			"CROSS_COMPILE64=${UBOOT_COMPILER}" \
			"CFG_WITH_ARM_TRUSTED_FW=y" \
			all
	)

	declare -g OPTEE_OUT="${OPTEE_DIR}/out/arm-plat-stm32mp2/core"

	# TF-A needs the OP-TEE blobs and U-Boot binaries: rebuild the FIP.
	# ENABLE_LTO=0: Ubuntu's gcc driver injects .note.gnu.build-id at address
	# zero when used as the LTO linker wrapper, which makes the plain objcopy
	# STM32 image span the whole 0x0..0x0e002600 gap (235MB sparse file).
	display_alert "Re-linking TF-A FIP with OP-TEE + U-Boot" "${BOARD}" "info"
	(
		cd "${MYB_ATF_DIR}" || exit 1
		run_host_command_logged make -j"$(nproc)" \
			"PLAT=stm32mp2" \
			"ARCH=aarch64" \
			"ARM_ARCH_MAJOR=8" \
			"CROSS_COMPILE=${ATF_COMPILER}" \
			"LOG_LEVEL=40" \
			"SPD=opteed" \
			"ENABLE_LTO=0" \
			"STM32MP_SDMMC=1" \
			"STM32MP_EMMC=1" \
			"STM32MP_LPDDR4_TYPE=1" \
			"DTB_FILE_NAME=${STM32MP2_DTB}.dtb" \
			"BL32=${OPTEE_OUT}/tee-header_v2.bin" \
			"BL32_EXTRA1=${OPTEE_OUT}/tee-pager_v2.bin" \
			"BL32_EXTRA2=${OPTEE_OUT}/tee-pageable_v2.bin" \
			"BL33=${MYB_UBOOT_DIR}/u-boot-nodtb.bin" \
			"BL33_CFG=${MYB_UBOOT_DIR}/u-boot.dtb" \
			all fip

		cp "build/stm32mp2/release/fip.bin" "${MYB_UBOOT_DIR}/fip.bin"
		cp "build/stm32mp2/release/tf-a-${STM32MP2_DTB}.stm32" "${MYB_UBOOT_DIR}/tf-a.stm32"
	)

	# Restore the u-boot working directory for Armbian's packaging step.
	cd "${MYB_UBOOT_DIR}" || exit_with_error "Could not cd back to ${MYB_UBOOT_DIR}"
}

case "${BRANCH}" in

	vendor)
		KERNELSOURCE='https://github.com/STMicroelectronics/linux.git'
		KERNELBRANCH="tag:v6.6-stm32mp-r3.1"
		declare -g KERNEL_MAJOR_MINOR="6.6"
		KERNELPATCHDIR="${LINUXFAMILY}-${BRANCH}"
		LINUXCONFIG="linux-${LINUXFAMILY}-${BRANCH}"
		;;

esac

write_uboot_platform() {
	local src_dir="$1" dev tf_a fip dump name first count line start size found spec
	local boot0 boot1 ro0 ro1 old0 old1 rc=0
	local -a missing=()

	dev="$(readlink -f "$2")" || return 1
	tf_a="${src_dir}/tf-a.stm32"
	fip="${src_dir}/fip.bin"
	boot0="${dev}boot0"
	boot1="${dev}boot1"

	[[ -b "$dev" ]] || { echo "Invalid block device: $dev" >&2; return 1; }
	[[ -s "$tf_a" && -s "$fip" ]] || { echo "Missing TF-A or FIP in $src_dir" >&2; return 1; }
	[[ "$(blockdev --getss "$dev")" == 512 ]] || { echo "Unsupported sector size on $dev" >&2; return 1; }
	(( $(stat -c %s "$tf_a") <= 1048576 && $(stat -c %s "$fip") <= 4194304 )) || {
		echo "TF-A or FIP exceeds its partition" >&2; return 1;
	}
	(( $(blockdev --getsize64 "$dev") >= 16777216 )) || { echo "Device is too small: $dev" >&2; return 1; }

	if [[ -b "$boot0" || -b "$boot1" ]]; then
		[[ -b "$boot0" && -b "$boot1" ]] || { echo "Incomplete eMMC boot devices for $dev" >&2; return 1; }
		ro0="/sys/block/${dev##*/}boot0/force_ro"
		ro1="/sys/block/${dev##*/}boot1/force_ro"
		[[ -r "$ro0" && -w "$ro0" && -r "$ro1" && -w "$ro1" ]] || {
			echo "Cannot control eMMC boot partition read-only state" >&2; return 1;
		}
		command -v mmc >/dev/null || { echo "mmc-utils is required" >&2; return 1; }
		(( $(blockdev --getsize64 "$boot0") >= $(stat -c %s "$tf_a") &&
		   $(blockdev --getsize64 "$boot1") >= $(stat -c %s "$tf_a") )) || {
			echo "TF-A exceeds an eMMC boot partition" >&2; return 1;
		}
	fi

	dump="$(sfdisk --dump "$dev")" || return 1
	[[ "$dump" == *$'label: gpt\n'* ]] || { echo "GPT is required on $dev" >&2; return 1; }

	while read -r name first count; do
		found=0
		while IFS= read -r line; do
			[[ "$line" == *' : start='* ]] || continue
			[[ "$line" =~ start=[[:space:]]*([0-9]+) ]] || {
				echo "Cannot parse partition: $line" >&2; return 1;
			}
			start="${BASH_REMATCH[1]}"
			[[ "$line" =~ size=[[:space:]]*([0-9]+) ]] || {
				echo "Cannot parse partition: $line" >&2; return 1;
			}
			size="${BASH_REMATCH[1]}"
			if [[ "$line" == *"name=\"${name}\""* ]]; then
				(( start == first && size == count )) || {
					echo "Partition $name has unexpected geometry on $dev" >&2; return 1;
				}
				(( found == 0 )) || { echo "Duplicate partition $name on $dev" >&2; return 1; }
				found=1
			elif (( start < first + count && first < start + size )); then
				echo "Partition overlaps $name reserved area on $dev" >&2; return 1
			fi
		done <<< "$dump"
		if (( ! found )); then
			missing+=("$name $first $count")
		fi
	done <<'PARTITIONS'
fsbla 2048 2048
fip 4096 8192
u-boot-env 19456 2048
PARTITIONS
	for spec in "${missing[@]}"; do
		read -r name first count <<< "$spec"
		printf 'start=%s,size=%s,name="%s"\n' "$first" "$count" "$name" |
			sfdisk --no-reread --append "$dev" || return 1
	done

	dd if="$tf_a" of="$dev" bs=512 seek=2048 conv=notrunc,fsync status=none || return 1
	dd if="$fip" of="$dev" bs=512 seek=4096 conv=notrunc,fsync status=none || return 1

	if [[ -b "$boot0" ]]; then
		old0="$(<"$ro0")"; old1="$(<"$ro1")"
		printf '0\n' > "$ro0" || return 1
		if ! printf '0\n' > "$ro1"; then
			printf '%s\n' "$old0" > "$ro0"
			return 1
		fi
		dd if="$tf_a" of="$boot0" bs=512 conv=notrunc,fsync status=none || rc=1
		if (( rc == 0 )); then
			dd if="$tf_a" of="$boot1" bs=512 conv=notrunc,fsync status=none || rc=1
		fi
		printf '%s\n' "$old0" > "$ro0" || rc=1
		printf '%s\n' "$old1" > "$ro1" || rc=1
		(( rc == 0 )) || return 1
		mmc bootbus set single_backward x1 x1 "$dev" || return 1
		mmc bootpart enable 1 1 "$dev" || return 1
	fi
}
